name: Italian Windows installer

on:
  push:
    branches:
      - localization/italiano
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: Build Italian Tine installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path (Join-Path $nsisPath 'makensis.exe'))) {
            throw "NSIS was not installed at '$nsisPath'."
          }
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows installer with Italian catalog
        shell: pwsh
        run: .\scripts\build-windows-italian.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: tine-windows-italian-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
